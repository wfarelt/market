{% extends "base.html" %}

{% block title %}Configuración de la empresa{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-between mb-4">
	<h5 class="mb-0 fw-semibold">Configuración de la empresa</h5>
</div>

<div class="card border-0 shadow-sm">
	<div class="card-body p-4">
		<form method="post" novalidate>
			{% csrf_token %}
			<div class="row g-3">
				{% for field in form %}
				<div class="{% if field.name == 'address' %}col-12{% else %}col-md-6{% endif %}">
					<label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
					{{ field }}
					{% if field.errors %}<div class="invalid-feedback d-block">{{ field.errors|join:", " }}</div>{% endif %}
				</div>
				{% endfor %}
			</div>
			<div class="d-flex justify-content-end gap-2 mt-4">
				<button class="btn btn-primary">Guardar</button>
			</div>
		</form>
	</div>
</div>
{% endblock %}
