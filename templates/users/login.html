<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Market</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-body-tertiary">
  <div class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="card border-0 shadow-sm" style="width:360px;">
      <div class="card-body p-4">
        <h5 class="fw-semibold mb-4 text-center">Market ERP</h5>
        <form method="post" novalidate>
          {% csrf_token %}
          {% if form.errors %}
            <div class="alert alert-danger py-2 small">Usuario o contraseña incorrectos.</div>
          {% endif %}
          <div class="mb-3">
            <label for="{{ form.username.id_for_label }}" class="form-label">Usuario</label>
            <input type="text" name="username" id="{{ form.username.id_for_label }}"
                   class="form-control" autofocus autocomplete="username">
          </div>
          <div class="mb-4">
            <label for="{{ form.password.id_for_label }}" class="form-label">Contraseña</label>
            <input type="password" name="password" id="{{ form.password.id_for_label }}"
                   class="form-control" autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
