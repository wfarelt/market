{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-between mb-4"><h5 class="mb-0 fw-semibold">{{ title }}</h5><a href="{% url 'inventory:list' %}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Volver</a></div>
<div class="card border-0 shadow-sm" style="max-width:560px;"><div class="card-body p-4"><form method="post" novalidate>{% csrf_token %}
  {% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="invalid-feedback d-block">{{ field.errors|join:", " }}</div>{% endif %}</div>{% endfor %}
  <div class="d-flex justify-content-end gap-2"><a href="{% url 'inventory:list' %}" class="btn btn-outline-secondary">Cancelar</a><button type="submit" class="btn btn-primary">Guardar</button></div>
</form></div></div>
{% endblock %}
