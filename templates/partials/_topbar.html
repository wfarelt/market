<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top" style="height:56px;">
  <div class="container-fluid px-3">
    <a class="navbar-brand fw-semibold d-flex align-items-center gap-2" href="{% url 'dashboard:index' %}">{% if company_settings.logo %}<img src="{{ company_settings.logo.url }}" alt="{{ company_settings.name }}" width="32" height="32" class="rounded object-fit-cover">{% endif %}{{ company_settings.trade_name|default:company_settings.name }}</a>
    <div class="ms-auto d-flex align-items-center gap-2">
      {% if request.user.is_authenticated %}
        <span class="text-white-50 small">{{ request.user.get_full_name|default:request.user.username }}</span>
        <a href="{% url 'users:profile' %}" class="btn btn-sm btn-outline-light" title="Mi perfil"><i class="bi bi-person"></i></a>
        <form method="post" action="{% url 'users:logout' %}" class="d-inline">
          {% csrf_token %}
          <button type="submit" class="btn btn-sm btn-outline-light">Salir</button>
        </form>
      {% endif %}
    </div>
  </div>
</nav>
