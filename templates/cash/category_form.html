{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-between mb-4">
  <h5 class="mb-0 fw-semibold">{{ title }}</h5>
  <a href="{% url 'cash:category-list' %}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Volver</a>
</div>

<div class="card border-0 shadow-sm" style="max-width: 560px;">
  <div class="card-body p-4">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold small" for="{{ form.name.id_for_label }}">Nombre</label>
        {{ form.name }}
        {% if form.name.errors %}<div class="invalid-feedback d-block">{{ form.name.errors|join:", " }}</div>{% endif %}
      </div>
      <div class="form-check mb-4">
        {{ form.is_active }}
        <label class="form-check-label" for="{{ form.is_active.id_for_label }}">Categoría activa</label>
      </div>
      <div class="d-flex justify-content-end gap-2"><a href="{% url 'cash:category-list' %}" class="btn btn-outline-secondary">Cancelar</a><button class="btn btn-primary">Guardar</button></div>
    </form>
  </div>
</div>
{% endblock %}
