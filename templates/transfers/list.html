{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-4"><h5 class="fw-semibold">Traspasos</h5><a class="btn btn-primary btn-sm" href="{% url 'transfers:create' %}">+ Nuevo</a></div><div class="card border-0 shadow-sm"><table class="table table-hover mb-0"><thead><tr><th>Número</th><th>Origen</th><th>Destino</th><th>Estado</th></tr></thead><tbody>{% for transfer in transfers %}<tr><td><a href="{% url 'transfers:detail' transfer.pk %}">{{ transfer.number }}</a></td><td>{{ transfer.origin_branch }}</td><td>{{ transfer.destination_branch }}</td><td>{{ transfer.get_status_display }}</td></tr>{% empty %}<tr><td colspan="4" class="text-center">Sin traspasos.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
